defaults:
  - replay_eval
  - override flows/animate: animate_pipeline
  - _self_

# --- Animate pipeline: Low VRAM profile ---
# WAN 2.1 I2V 14B + 텍스트 인코더 CPU 오프로드
# Expected VRAM: ~8GB (vs ~12GB with standard profile)
models:
  mode_classifier:
    _target_: discoverex.adapters.outbound.models.gemini_mode_classifier.GeminiModeClassifier
    model: ${oc.env:GEMINI_MODEL,gemini-2.5-flash}
    max_retries: 3
  vision_analyzer:
    _target_: discoverex.adapters.outbound.models.gemini_vision_analyzer.GeminiVisionAnalyzer
    model: ${oc.env:GEMINI_MODEL,gemini-2.5-flash}
    max_retries: 3
  animation_generation:
    _target_: discoverex.adapters.outbound.models.comfyui_wan_generator.ComfyUIWanGenerator
    base_url: ${oc.env:COMFYUI_URL,http://127.0.0.1:8188}
    workflow_path: ${oc.env:COMFYUI_WORKFLOW_PATH,conf/workflows/wan21_i2v_lowvram.json}
    steps: 20
    width: 480
    height: 480
    timeout_upload: 30
    timeout_poll: 1800
    poll_interval: 2.0
    free_between_attempts: false
  ai_validator:
    _target_: discoverex.adapters.outbound.models.gemini_ai_validator.GeminiAIValidator
    model: ${oc.env:GEMINI_MODEL,gemini-2.5-flash}
    max_retries: 2
  post_motion_classifier:
    _target_: discoverex.adapters.outbound.models.gemini_post_motion.GeminiPostMotionClassifier
    model: ${oc.env:GEMINI_MODEL,gemini-2.5-flash}
    max_retries: 2

animate_adapters:
  bg_remover:
    _target_: discoverex.adapters.outbound.animate.bg_remover.RembgBgRemover
    model_name: u2net
  numerical_validator:
    _target_: discoverex.adapters.outbound.animate.numerical_validator.NumericalAnimationValidator
  mask_generator:
    _target_: discoverex.adapters.outbound.animate.mask_generator.PilMaskGenerator
  keyframe_generator:
    _target_: discoverex.adapters.outbound.animate.keyframe_generator.PilKeyframeGenerator
  format_converter:
    _target_: discoverex.adapters.outbound.animate.format_converter.MultiFormatConverter
  image_upscaler:
    _target_: discoverex.adapters.outbound.animate.pil_upscaler.PilImageUpscaler

max_retries: 7
