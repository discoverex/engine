defaults:
  - replay_eval
  - override flows/animate: animate_pipeline
  - _self_

# --- Animate pipeline: Gemini (4 ports) + ComfyUI (generation) ---
models:
  mode_classifier:
    _target_: discoverex.adapters.outbound.models.gemini_mode_classifier.GeminiModeClassifier
    model: ${oc.env:GEMINI_MODEL,gemini-2.5-flash}
    max_retries: 3
  vision_analyzer:
    _target_: discoverex.adapters.outbound.models.gemini_vision_analyzer.GeminiVisionAnalyzer
    model: ${oc.env:GEMINI_MODEL,gemini-2.5-flash}
    max_retries: 3
  animation_generation:
    _target_: discoverex.adapters.outbound.models.comfyui_wan_generator.ComfyUIWanGenerator
    base_url: ${oc.env:COMFYUI_URL,http://127.0.0.1:8188}
    workflow_path: ${oc.env:COMFYUI_WORKFLOW_PATH,conf/workflows/wan21_i2v.json}
    steps: 20
    width: 480
    height: 480
    timeout_upload: 30
    timeout_poll: 1800
    poll_interval: 2.0
    free_between_attempts: false
  ai_validator:
    _target_: discoverex.adapters.outbound.models.gemini_ai_validator.GeminiAIValidator
    model: ${oc.env:GEMINI_MODEL,gemini-2.5-flash}
    max_retries: 2
  post_motion_classifier:
    _target_: discoverex.adapters.outbound.models.gemini_post_motion.GeminiPostMotionClassifier
    model: ${oc.env:GEMINI_MODEL,gemini-2.5-flash}
    max_retries: 2

animate_adapters:
  bg_remover:
    _target_: discoverex.adapters.outbound.animate.dummy_animate.DummyBgRemover
  numerical_validator:
    _target_: discoverex.adapters.outbound.animate.dummy_animate.DummyAnimationValidator
  mask_generator:
    _target_: discoverex.adapters.outbound.animate.dummy_animate.DummyMaskGenerator
  keyframe_generator:
    _target_: discoverex.adapters.outbound.animate.dummy_animate.DummyKeyframeGenerator
  format_converter:
    _target_: discoverex.adapters.outbound.animate.dummy_animate.DummyFormatConverter

max_retries: 7
