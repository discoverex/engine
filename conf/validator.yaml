defaults:
  - models/physical_extraction: mobilesam
  - models/logical_extraction: moondream2
  - models/visual_verification: yolo_clip
  - adapters/artifact_store: local
  - adapters/metadata_store: local_json
  - adapters/tracker: mlflow_file
  - adapters/scene_io: json
  - adapters/report_writer: local_json
  - runtime/model_runtime: gpu
  - runtime/env: default
  - _self_

thresholds:
  is_hidden_min_conditions: 2
  pass_threshold: 0.23  # MVP: 0.35 → 0.23 (데이터 확보 우선, 학습 후 상향 조정)

# weights_path: null  # 학습된 가중치 JSON 경로. 지정 시 weights: 섹션 무시.
weights_path: null

# MVP 데이터 수집: VerificationBundle 을 JSON 파일로 저장할 디렉터리.
# null 이면 저장하지 않음. label 필드는 null 로 저장되어 나중에 채울 수 있음.
bundle_store_dir: "engine/src/ML/data"

weights:
  perception_sigma: 0.50
  perception_drr: 0.50
  logical_hop: 0.55
  logical_degree: 0.45
  total_perception: 0.45
  total_logical: 0.55
  difficulty_occlusion: 0.25
  difficulty_sigma: 0.20
  difficulty_hop: 0.20
  difficulty_degree: 0.15
  difficulty_drr: 0.20
  difficulty_interaction: 0.10
