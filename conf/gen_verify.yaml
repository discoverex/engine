defaults:
  - models/background_generator: dummy
  - models/background_upscaler: dummy
  - models/object_generator: dummy
  - models/hidden_region: dummy
  - models/inpaint: dummy
  - models/perception: dummy
  - models/fx: dummy
  - adapters/artifact_store: local
  - adapters/metadata_store: local_json
  - adapters/tracker: mlflow_local
  - adapters/scene_io: json
  - adapters/report_writer: local_json
  - runtime/model_runtime: gpu
  - runtime/env: default
  - flows/generate: default
  - flows/verify: default
  - flows/animate: stub
  - region_selection: default
  - object_variants: default
  - patch_similarity: default
  - color_harmonization: default
  - _self_
  - profile: default

runtime:
  width: 1024
  height: 768
  config_version: config-v1
  artifacts_root: artifacts

thresholds:
  logical_pass: 0.7
  perception_pass: 0.7
  final_pass: 0.75

model_versions:
  background_generator: background-generator-v0
  background_upscaler: background-upscaler-v0
  object_generator: object-generator-v0
  hidden_region: hidden-region-v0
  inpaint: inpaint-v0
  perception: perception-v0
  fx: fx-v0
