[project]
name = "discoverex-core"
version = "0.1.0"
description = "Discoverex core engine: generation, verification, UX packaging, storage, and tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "pydantic>=2.12.5",
    "typer>=0.24.1",
]

[project.optional-dependencies]
orchestration = [
    "prefect>=3.6.20",
]
tracking = [
    "mlflow>=3.10.0",
]
storage = [
    "boto3>=1.42.59",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.47",
]
ml-cpu = [
    "torch>=2.10.0",
    "transformers>=5.2.0",
]
ml-gpu = [
    "accelerate>=1.12.0",
    "torch>=2.10.0",
    "transformers>=5.2.0",
]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "ruff>=0.15.4",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discoverex"]

[project.scripts]
discoverex = "discoverex.adapters.inbound.cli.main:app"

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP017", "UP037", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["arg-type", "call-arg", "misc", "return-value"]
