[project]
name = "discoverex-core"
version = "0.1.0"
description = "Discoverex core engine: generation, verification, UX packaging, storage, and tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "networkx>=3.6.1",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.1.1",
    "prefect>=3.6.20",
    "pydantic>=2.12.5",
    "typer>=0.24.1",
    "pydantic-settings>=2.13.1",
    "typer>=0.24.1",
]

[project.optional-dependencies]
tracking = [
    "mlflow>=3.10.0",
]
storage = [
    "boto3>=1.42.59",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.47",
]
ml-cpu = [
    "diffusers>=0.35.2",
    "pillow>=11.3.0",
    "safetensors>=0.6.2",
    "torch>=2.10.0",
    "transformers>=4.46,<5.0",
]
ml-gpu = [
    "accelerate>=1.12.0",
    "diffusers>=0.35.2",
    "pillow>=11.3.0",
    "safetensors>=0.6.2",
    "torch>=2.10.0",
    "transformers>=4.46,<5.0",
]
validator = [
    "bitsandbytes>=0.49.2",
    "mobile-sam",
    "networkx>=3.6.1",
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "ultralytics>=8.4.19",
]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "ruff>=0.15.4",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discoverex"]

[project.scripts]
discoverex = "discoverex.adapters.inbound.cli.main:app"
discoverex-orch-launcher = "discoverex.orchestrator_contract.launcher:main"
discoverex-execution-launcher = "discoverex.adapters.outbound.execution.launcher:main"

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git" }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP017", "UP037", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
mypy_path = ["src"]
files = ["src", "infra/register", "tests"]
exclude = ["^src/sample/", "^src/ML/"]

[[tool.mypy.overrides]]
module = [
    "PIL",
    "PIL.*",
    "boto3",
    "diffusers",
    "mlflow",
    "mobile_sam",
    "networkx",
    "numpy",
    "scipy",
    "scipy.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "torch",
    "transformers",
    "ultralytics",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
