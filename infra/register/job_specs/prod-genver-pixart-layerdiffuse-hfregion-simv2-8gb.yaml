run_mode: repo
engine: discoverex
repo_url: https://github.com/discoverex/engine.git
ref: feat/engin-worker-observility
entrypoint:
  - prefect_flow.py:run_generate_job_flow
config: null
job_name: prod-genver-pixart-layerdiffuse-hfregion-simv2-8gb
inputs:
  contract_version: v2
  command: generate
  config_name: generate
  config_dir: conf
  args:
    background_prompt: stormy harbor at dusk, cinematic hidden object puzzle background
    background_negative_prompt: blurry, low quality, artifact
    object_prompt: banana
    object_negative_prompt: blurry, low quality, artifact
    final_prompt: polished playable hidden object scene
    final_negative_prompt: blurry, low quality, artifact
  overrides:
    - profile=generator_pixart_gpu_v2_8gb
    - runtime/model_runtime=gpu
    - flows/generate=v2
    - runtime.width=1024
    - runtime.height=1024
    - models/background_generator=pixart_sigma_8gb
    - models/object_generator=layerdiffuse
    - models/hidden_region=hf
    - models/inpaint=sdxl_gpu_similarity_v2
    - models/perception=hf
    - models/fx=copy_image
    - runtime.model_runtime.offload_mode=sequential
  runtime:
    mode: worker
    bootstrap_mode: auto
    extras:
      - tracking
      - storage
      - ml-gpu
      - validator
    extra_env: {}
env: {}
outputs_prefix: null
