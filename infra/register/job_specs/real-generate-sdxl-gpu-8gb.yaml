run_mode: repo
engine: discoverex
repo_url: https://github.com/discoverex/engine.git
ref: feat/inline-resolved-config-registration
entrypoint:
  - /bin/sh
  - -lc
  - PYTHONPATH=src python -m discoverex.orchestrator_contract.launcher
config: null
job_name: quick-generate-1-https
inputs:
  contract_version: v2
  command: generate
  config_name: generate
  config_dir: conf
  args:
    background_prompt: stormy harbor at dusk, cinematic hidden object puzzle background
    background_negative_prompt: blurry, low quality, artifact
    object_prompt: hidden golden compass
    object_negative_prompt: blurry, low quality, artifact
    final_prompt: polished playable hidden object scene
    final_negative_prompt: blurry, low quality, artifact
  overrides:
    - runtime/model_runtime=gpu
    - runtime.width=512
    - runtime.height=384
    - models/background_generator=sdxl_gpu
    - models/hidden_region=hf
    - models.inpaint.generation_strength=0.65
    - models.inpaint.generation_steps=40
    - models.inpaint.generation_guidance_scale=7.0
    - models.inpaint.mask_blur=8
    - models.inpaint.inpaint_only_masked=true
    - models.inpaint.masked_area_padding=32
    - models/inpaint=sdxl_gpu
    - models/perception=hf
    - models/fx=copy_image
  runtime:
    mode: worker
    bootstrap_mode: auto
    extras:
      - tracking
      - storage
      - ml-gpu
    extra_env: {}
env: {}
outputs_prefix: null
