services:
  postgres:
    image: postgres:16
    container_name: discoverex-postgres
    environment:
      POSTGRES_USER: discoverex
      POSTGRES_PASSWORD: discoverex
      POSTGRES_DB: discoverex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: discoverex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mlflow:
    image: python:3.11-slim
    container_name: discoverex-mlflow
    working_dir: /app
    depends_on:
      - postgres
      - minio
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "5000:5000"
    command: >
      bash -lc "pip install --no-cache-dir mlflow boto3 psycopg2-binary &&
      mlflow server
      --backend-store-uri postgresql://discoverex:discoverex@postgres:5432/discoverex
      --default-artifact-root s3://discoverex-artifacts
      --host 0.0.0.0 --port 5000"

  airflow:
    image: apache/airflow:2.10.3
    container_name: discoverex-airflow
    profiles: ["airflow"]
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://discoverex:discoverex@postgres:5432/discoverex
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
